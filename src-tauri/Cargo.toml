[package]
name = "agentport"
version = "0.1.0"
description = "AgentPort - Portable Workspace & Context Migrator for AI Coding Agents"
authors = ["songtianlun"]
edition = "2021"

[lib]
name = "agentport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2.12", features = ["json"] }
