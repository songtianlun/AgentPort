name: Docker Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Docker Metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_suffixes: ${{ steps.meta.outputs.tag_suffixes }}
      ghcr_image: ${{ steps.meta.outputs.ghcr_image }}
      dockerhub_enabled: ${{ steps.meta.outputs.dockerhub_enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and image tags
        id: meta
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            if [[ "${VERSION}" == *-* ]]; then
              TAG_SUFFIXES="${VERSION}"
            else
              TAG_SUFFIXES="${VERSION},latest"
            fi
          else
            VERSION="$(git describe --dirty --always --tags --abbrev=7 2>/dev/null || echo devel)"
            TAG_SUFFIXES="devel"
          fi

          GHCR_IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_suffixes=${TAG_SUFFIXES}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_enabled=${HAS_DOCKERHUB}" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=${VERSION}, tags=${TAG_SUFFIXES}, ghcr=${GHCR_IMAGE}, dockerhub=${HAS_DOCKERHUB}"

  docker-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-24.04
    needs: prepare
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push amd64 digest to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          outputs: type=image,name=${{ needs.prepare.outputs.ghcr_image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agentport-amd64
          cache-to: type=gha,mode=max,scope=agentport-amd64

  docker-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-24.04-arm
    needs: prepare
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push arm64 digest to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          outputs: type=image,name=${{ needs.prepare.outputs.ghcr_image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agentport-arm64
          cache-to: type=gha,mode=max,scope=agentport-arm64

  docker-manifest:
    name: Publish Multi-Arch Manifest
    runs-on: ubuntu-24.04
    needs: [prepare, docker-amd64, docker-arm64]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: needs.prepare.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest to GHCR
        env:
          IMAGE: ${{ needs.prepare.outputs.ghcr_image }}
          TAG_SUFFIXES: ${{ needs.prepare.outputs.tag_suffixes }}
          AMD64_DIGEST: ${{ needs.docker-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.docker-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          tag_args=()
          IFS=',' read -ra suffixes <<< "${TAG_SUFFIXES}"
          for s in "${suffixes[@]}"; do
            tag_args+=("-t" "${IMAGE}:${s}")
          done
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"
          docker buildx imagetools inspect "${IMAGE}:${suffixes[0]}"

      - name: Mirror multi-arch manifest to Docker Hub (optional)
        if: needs.prepare.outputs.dockerhub_enabled == 'true'
        env:
          GHCR_IMAGE: ${{ needs.prepare.outputs.ghcr_image }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG_SUFFIXES: ${{ needs.prepare.outputs.tag_suffixes }}
          AMD64_DIGEST: ${{ needs.docker-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.docker-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          DH_IMAGE="docker.io/$(echo "${DOCKERHUB_USER}" | tr '[:upper:]' '[:lower:]')/agentport"
          tag_args=()
          IFS=',' read -ra suffixes <<< "${TAG_SUFFIXES}"
          for s in "${suffixes[@]}"; do
            tag_args+=("-t" "${DH_IMAGE}:${s}")
          done
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${GHCR_IMAGE}@${AMD64_DIGEST}" \
            "${GHCR_IMAGE}@${ARM64_DIGEST}"
