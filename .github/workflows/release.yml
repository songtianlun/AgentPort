name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). Leave empty to use current ref.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve-meta:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Compute tag and semver version
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            echo "::error::Release workflow requires a vX.Y.Z tag or manual tag input."
            exit 1
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag format '${TAG}'. Expected vX.Y.Z (e.g. v0.1.0)."
            exit 1
          fi

          VERSION="${TAG#v}"
          PRERELEASE="false"
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE="true"
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release: tag=${TAG}, version=${VERSION}, prerelease=${PRERELEASE}"

  build-tauri:
    name: Build (${{ matrix.label }})
    needs: resolve-meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - label: macOS-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - label: Linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - label: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync version from git tag (${{ needs.resolve-meta.outputs.version }})
        env:
          RELEASE_VERSION: ${{ needs.resolve-meta.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const ver = process.env.RELEASE_VERSION;

            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = ver;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.version = ver;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");

            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            fs.writeFileSync(
              "src-tauri/Cargo.toml",
              cargo.replace(/^version = "[^"]+"$/m, `version = "${ver}"`)
            );
            console.log(`Synced package.json, tauri.conf.json, and Cargo.toml to ${ver}`);
          '

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect platform bundles
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const out = "dist-artifacts";
            fs.mkdirSync(out, { recursive: true });
            const root = path.join("src-tauri", "target", process.env.TARGET, "release", "bundle");
            const exts = [".dmg", ".AppImage", ".deb", ".msi", ".exe"];
            const collected = [];

            function walk(dir) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (exts.some((ext) => entry.name.endsWith(ext))) {
                  fs.copyFileSync(full, path.join(out, entry.name));
                  collected.push(entry.name);
                }
              }
            }

            walk(root);
            console.log("Collected bundles:", collected);
            if (collected.length === 0) {
              console.error(`No installer artifacts found under ${root}`);
              process.exit(1);
            }
          '

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentPort-${{ matrix.label }}
          path: dist-artifacts/*
          if-no-files-found: error

  publish-release:
    name: Create or Update GitHub Release
    needs: [resolve-meta, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-meta.outputs.tag }}
          name: AgentPort ${{ needs.resolve-meta.outputs.tag }}
          prerelease: ${{ needs.resolve-meta.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.resolve-meta.outputs.prerelease == 'false' }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
